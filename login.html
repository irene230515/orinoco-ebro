<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso clientes · Orinoco &amp; Ebro</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px; width: 100%; max-width: 380px;
  }
  .login-card input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 15px;
  }
  .login-card button { width: 100%; }
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="logo"><a href="/" style="color:inherit;text-decoration:none;">Orinoco <span class="amp">&amp;</span> Ebro</a></div>
  </div>
</header>

<div class="login-wrap">
  <div class="login-card">
    <h2>Acceso clientes</h2>
    <p>Placeholder de login — pendiente de conectar a tu backend/auth real.</p>
    <form onsubmit="alert('Conecta este formulario a tu proveedor de autenticación.'); return false;">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Contraseña" required>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Orinoco &amp; Ebro Consultores</p>
  </div>
</footer>
</body>
</html>
